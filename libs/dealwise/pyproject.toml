[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages.find.include = ["dealwise*"]
packages.find.exclude = ["tests*"]

[project]
name = "dealwise"
version = "0.1.0"
requires-python = ">= 3.10"
description = "DealWise: contract & deal intelligence layer built on Kotaemon (ktem)."
dependencies = [
    "python-decouple>=3.8,<4",
    "SQLAlchemy>=2.0.29,<3",
    "sqlmodel>=0.0.16,<0.1",
]
